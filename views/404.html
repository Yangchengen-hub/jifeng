<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - 页面不存在 | 极风工作室</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  color-scheme: dark;
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: #1a1a28;
  --accent: #00f5ff;
  --accent-2: #7b2ff7;
  --accent-3: #ff00d4;
  --accent-grad: linear-gradient(135deg, #00f5ff, #7b2ff7, #ff00d4);
  --accent-glow: rgba(0, 245, 255, 0.35);
  --f-display: 'Orbitron', 'Noto Sans SC', sans-serif;
  --f-body: 'Noto Sans SC', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', monospace;
}
html,body{height:100%}
body{
  font-family:var(--f-body);
  background:var(--bg-primary);
  color:#e8e8f0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  position:relative;
  overflow:hidden;
}
.grid-bg{
  position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(0,245,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,245,255,.04) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
}
.scanline{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 2px,
    rgba(0,0,0,.08) 2px,
    rgba(0,0,0,.08) 4px
  );
  opacity:.5;
}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.4;z-index:0;animation:float 8s ease-in-out infinite}
.orb1{width:400px;height:400px;background:#00f5ff;top:-100px;left:-100px;animation-delay:0s}
.orb2{width:350px;height:350px;background:#7b2ff7;bottom:-80px;right:-80px;animation-delay:-3s}
.orb3{width:300px;height:300px;background:#ff00d4;top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:-5s;opacity:.2}
@keyframes float{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(30px,-30px) scale(1.05)}
  66%{transform:translate(-20px,20px) scale(.95)}
}
.container{
  max-width:560px;width:100%;text-align:center;
  position:relative;z-index:10;
}
.code-wrap{
  position:relative;
  margin-bottom:32px;
}
.code{
  font-size:clamp(100px, 20vw, 160px);
  font-weight:900;
  font-family:var(--f-display);
  background:var(--accent-grad);
  background-size:200% 200%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1;
  letter-spacing:-4px;
  animation:glitch 3s infinite, gradientShift 4s ease infinite;
  filter: drop-shadow(0 0 40px rgba(0,245,255,.4));
  position:relative;
}
@keyframes glitch{
  0%,90%,100%{transform:translate(0)}
  92%{transform:translate(-3px,2px)}
  94%{transform:translate(3px,-2px)}
  96%{transform:translate(-2px,-1px)}
  98%{transform:translate(2px,1px)}
}
.code::before,
.code::after{
  content:'404';
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  background:var(--accent-grad);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.code::before{
  animation:glitchTop 2s infinite;
  clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
  color:#ff00d4;
}
.code::after{
  animation:glitchBot 2.5s infinite;
  clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
  color:#00f5ff;
}
@keyframes glitchTop{
  0%,100%{transform:translate(0)}
  20%{transform:translate(-2px,-2px)}
  40%{transform:translate(-2px,2px)}
  60%{transform:translate(2px,-2px)}
  80%{transform:translate(2px,2px)}
}
@keyframes glitchBot{
  0%,100%{transform:translate(0)}
  20%{transform:translate(2px,2px)}
  40%{transform:translate(2px,-2px)}
  60%{transform:translate(-2px,2px)}
  80%{transform:translate(-2px,-2px)}
}
@keyframes gradientShift{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.subtitle{
  font-family:var(--f-mono);
  font-size:13px;
  letter-spacing:.3em;
  color:var(--accent);
  text-transform:uppercase;
  margin-bottom:24px;
  opacity:.8;
}
.title{
  font-size:clamp(22px, 5vw, 32px);
  font-weight:700;
  font-family:var(--f-display);
  margin-bottom:16px;
  color:#fff;
  letter-spacing:.05em;
}
.desc{
  color:#8888aa;
  font-size:15px;
  line-height:1.8;
  margin-bottom:36px;
}
.btn-wrap{
  display:flex;
  gap:14px;
  justify-content:center;
  flex-wrap:wrap;
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:14px 32px;
  background:var(--accent-grad);
  background-size:200% 200%;
  animation:gradientShift 3s ease infinite;
  color:#fff;
  text-decoration:none;
  border-radius:12px;
  font-weight:700;
  font-size:14px;
  font-family:var(--f-display);
  letter-spacing:.1em;
  transition:all .3s;
  box-shadow: 0 4px 25px var(--accent-glow), 0 0 40px rgba(123,47,247,.25);
  position:relative;
  overflow:hidden;
  border:none;
  cursor:pointer;
}
.btn:hover{
  transform:translateY(-2px);
  box-shadow: 0 8px 40px var(--accent-glow), 0 0 60px rgba(123,47,247,.35);
}
.btn-secondary{
  background:transparent;
  border:1px solid rgba(0,245,255,.3);
  color:var(--accent);
  box-shadow:none;
  animation:none;
}
.btn-secondary:hover{
  background:rgba(0,245,255,.08);
  border-color:var(--accent);
  box-shadow: 0 0 20px rgba(0,245,255,.2);
}
.error-detail{
  margin-top:36px;
  padding:20px;
  background:rgba(26,26,40,.6);
  border:1px solid rgba(0,245,255,.15);
  border-radius:12px;
  text-align:left;
  backdrop-filter:blur(10px);
}
.detail-label{
  font-family:var(--f-mono);
  font-size:11px;
  letter-spacing:.2em;
  color:var(--accent);
  text-transform:uppercase;
  margin-bottom:12px;
  opacity:.8;
}
.detail-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
  font-size:13px;
}
.detail-row:last-child{margin-bottom:0}
.detail-key{
  color:#6666aa;
  font-family:var(--f-mono);
  flex-shrink:0;
  min-width:80px;
}
.detail-val{
  color:#aaaacc;
  font-family:var(--f-mono);
  word-break:break-all;
  flex:1;
}
.footer{
  margin-top:40px;
  color:#444466;
  font-size:12px;
  font-family:var(--f-mono);
  letter-spacing:.1em;
}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scanline"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="container">
  <div class="code-wrap">
    <div class="code">404</div>
  </div>
  <div class="subtitle">// PAGE NOT FOUND</div>
  <h1 class="title">页面不存在</h1>
  <p class="desc">
    您访问的页面不存在或已被移除。<br>
    请检查 URL 是否正确，或返回首页继续浏览。
  </p>
  
  <div class="btn-wrap">
    <a href="/" class="btn">← 返回首页</a>
    <a href="javascript:history.back()" class="btn btn-secondary">返回上页</a>
  </div>

  <div class="error-detail">
    <div class="detail-label">// 错误信息</div>
    <div class="detail-row">
      <span class="detail-key">STATUS</span>
      <span class="detail-val">404 Not Found</span>
    </div>
    <div class="detail-row">
      <span class="detail-key">PATH</span>
      <span class="detail-val" id="errPath">--</span>
    </div>
    <div class="detail-row">
      <span class="detail-key">TIME</span>
      <span class="detail-val" id="errTime">--</span>
    </div>
  </div>

  <div class="footer">极风工作室 © 2026 // JIFENG STUDIO</div>
</div>

<script>
document.getElementById('errPath').textContent = window.location.pathname;
document.getElementById('errTime').textContent = new Date().toLocaleString('zh-CN');
</script>
</body>
</html>
