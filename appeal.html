<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极风工作室 - 申诉解封</title>
<link rel="stylesheet" href="jifeng-ui.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0a0a0f}
.appeal-box{max-width:500px;width:90%;background:var(--bg2);border-radius:16px;padding:32px;box-shadow:0 0 40px rgba(0,245,255,.1)}
.appeal-icon{font-size:64px;text-align:center;margin-bottom:16px}
.appeal-title{text-align:center;color:var(--a);font-size:1.5rem;margin-bottom:.5rem}
.appeal-sub{text-align:center;color:var(--t3);font-size:.9rem;margin-bottom:2rem}
.form-group{margin-bottom:1.5rem}
.form-label{display:block;color:var(--t2);font-size:.85rem;margin-bottom:.5rem}
.form-input,.form-textarea{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(0,245,255,.2);border-radius:8px;padding:12px 16px;color:var(--t);font-size:.9rem;box-sizing:border-box}
.form-input:focus,.form-textarea:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px rgba(0,245,255,.1)}
.form-textarea{min-height:120px;resize:vertical;font-family:inherit}
.btn-submit{width:100%;padding:14px;background:linear-gradient(135deg,var(--a),#7b2ff7);color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;transition:all .3s}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,245,255,.3)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none}
.success-msg{text-align:center;color:#00ff88;padding:2rem 0}
.success-msg .icon{font-size:64px;margin-bottom:1rem}
.ban-info{background:rgba(255,59,92,.1);border:1px solid rgba(255,59,92,.3);border-radius:8px;padding:16px;margin-bottom:2rem}
.ban-info-row{display:flex;justify-content:space-between;padding:4px 0;color:var(--t3);font-size:.85rem}
.ban-info-row span:last-child{color:var(--t);font-family:monospace}
</style>
</head>
<body>
<div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>

<div class="appeal-box">
<div id="banInfo" class="ban-info" style="display:none"></div>
<div id="appealForm">
<div class="appeal-icon">&#128221;</div>
<h1 class="appeal-title">申诉解封申请</h1>
<p class="appeal-sub">填写以下信息，提交后管理员会尽快处理</p>
<div class="form-group">
<label class="form-label">联系邮箱 *</label>
<input type="email" id="contactEmail" class="form-input" placeholder="您的邮箱地址（用于接收处理结果）" required>
</div>
<div class="form-group">
<label class="form-label">申诉理由 *</label>
<textarea id="appealReason" class="form-textarea" placeholder="请详细说明您的情况，为什么认为应该解封..." required></textarea>
</div>
<div class="form-group">
<label class="form-label">附加说明（可选）</label>
<textarea id="appealMessage" class="form-textarea" placeholder="任何额外的信息..." style="min-height:80px"></textarea>
</div>
<button id="submitBtn" class="btn-submit" onclick="submitAppeal()">提交申诉</button>
</div>
<div id="successMsg" class="success-msg" style="display:none">
<div class="icon">&#9989;</div>
<h2 style="color:#00ff88">申诉已提交</h2>
<p style="color:var(--t3);margin-top:1rem">处理结果将发送到您的邮箱</p>
<p style="color:var(--t3);font-size:.8rem;margin-top:2rem">申诉编号: <span id="appealToken" style="color:var(--a);font-family:monospace"></span></p>
</div>
</div>

<script>
const urlParams=new URLSearchParams(window.location.search);
const fingerprint=urlParams.get('fp')||'';
const banType=urlParams.get('type')||'ip';
const banReason=urlParams.get('reason')||'';
const appealToken=urlParams.get('token')||'';

if(banReason){
document.getElementById('banInfo').style.display='block';
document.getElementById('banInfo').innerHTML='<div style="color:#ff3b5c;font-weight:bold;margin-bottom:8px">&#128683; 封禁信息</div><div class="ban-info-row"><span>封禁类型</span><span>'+(banType==='device'?'设备封禁':'IP封禁')+'</span></div><div class="ban-info-row"><span>封禁原因</span><span>'+banReason+'</span></div>';
}

async function submitAppeal(){
const email=document.getElementById('contactEmail').value.trim();
const reason=document.getElementById('appealReason').value.trim();
const message=document.getElementById('appealMessage').value.trim();
if(!email||!reason){alert('请填写邮箱和申诉理由');return}
const btn=document.getElementById('submitBtn');
btn.disabled=true;btn.textContent='提交中...';
try{
const res=await fetch('/api/appeal/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fingerprint_hash:fingerprint,type:banType,reason:reason,contact_email:email,appeal_message:message})});
const data=await res.json();
if(data.success){
document.getElementById('appealForm').style.display='none';
document.getElementById('successMsg').style.display='block';
document.getElementById('appealToken').textContent=data.appealToken||'';
}else{
alert(data.error||'提交失败，请稍后重试');
btn.disabled=false;btn.textContent='提交申诉';
}
}catch(e){
alert('网络错误，请稍后重试');
btn.disabled=false;btn.textContent='提交申诉';
}
}
</script>
</body>
</html>
