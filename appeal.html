<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=5.0">
<meta name="theme-color" content="#000000">
<title>访问受限 · 申诉解封</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#000;color:#f5f5f7;min-height:100vh}
.appeal-wrap{max-width:560px;margin:0 auto;padding:60px 20px;position:relative;z-index:1}
.appeal-card{background:rgba(28,28,30,0.8);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:36px 28px}
.appeal-icon{font-size:3rem;text-align:center;margin-bottom:16px}
.appeal-card h1{font-size:1.4rem;font-weight:800;text-align:center;margin-bottom:8px}
.appeal-card .sub{text-align:center;color:#98989d;font-size:.88rem;margin-bottom:24px;line-height:1.6}
.appeal-card textarea{width:100%;min-height:200px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#f5f5f7;font-size:.9rem;outline:none;resize:vertical;font-family:inherit;line-height:1.7}
.appeal-card textarea:focus{border-color:#ff6900;background:rgba(255,105,0,0.06)}
.appeal-card .btn-submit{width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,#ff6900,#ff9500);color:#fff;font-size:.95rem;font-weight:700;margin-top:16px;cursor:pointer;border:none;transition:all .3s cubic-bezier(0.34,1.56,0.64,1)}
.appeal-card .btn-submit:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,105,0,0.4)}
.appeal-card .btn-submit:disabled{opacity:.5;cursor:not-allowed}
.appeal-note{margin-top:20px;padding:14px;border-radius:12px;background:rgba(255,69,58,0.08);border:1px solid rgba(255,69,58,0.2);font-size:.78rem;color:#ff453a;line-height:1.6}
.appeal-success{text-align:center;padding:40px 0}
.appeal-success .check{font-size:3rem;margin-bottom:16px}
.appeal-success h2{font-size:1.2rem;margin-bottom:8px}
.appeal-success p{color:#98989d;font-size:.88rem}
</style>
</head>
<body>
<div class="ambient"><div class="orb"></div><div class="orb"></div></div>
<div class="appeal-wrap">
  <div class="appeal-card" id="appealForm">
    <div class="appeal-icon">🚫</div>
    <h1>访问受限</h1>
    <p class="sub">您的IP或设备因触发安全策略被临时限制访问。<br>如属误操作，请提交申诉，管理员审核后将解除限制。</p>
    <textarea id="appealContent" placeholder="请在此填写您的申诉承诺书：&#10;&#10;本人承诺：&#10;1. 未对本网站进行任何扫描、入侵、攻击等危害行为；&#10;2. 如为误触安全规则，保证今后不再触发类似行为；&#10;3. 遵守网站使用规范，不进行任何危害网站安全的操作；&#10;4. 如有违反，愿意接受永久封禁并承担相应法律责任。&#10;&#10;请补充说明您的情况（至少20字）..."></textarea>
    <button class="btn-submit" id="btnSubmitAppeal">提交申诉</button>
    <div class="appeal-note">
      ⚠️ 警告：申诉通过后如再次触发安全策略，将永久封禁IP和设备指纹，不再接受申诉。情节严重者将依法收集证据并提交公安机关处理。
    </div>
  </div>
  <div class="appeal-card" id="appealDone" style="display:none">
    <div class="appeal-success">
      <div class="check">✅</div>
      <h2>申诉已提交</h2>
      <p>您的申诉已进入审核队列，请耐心等待管理员处理。<br>审核结果将通过邮件通知（如您留有联系方式）。</p>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script>
document.getElementById('btnSubmitAppeal').onclick=function(){
  var content=document.getElementById('appealContent').value.trim();
  if(content.length<20){alert('申诉内容至少20字');return}
  var btn=this;btn.disabled=true;btn.textContent='提交中...';
  var fp=window.JF?JF.fp():{};
  fetch('/api/appeals/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:content,fid:fp.fid})})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.ok){document.getElementById('appealForm').style.display='none';document.getElementById('appealDone').style.display='block'}
      else{alert(d.error||'提交失败');btn.disabled=false;btn.textContent='提交申诉'}
    })
    .catch(function(){alert('网络错误，请稍后重试');btn.disabled=false;btn.textContent='提交申诉'});
};
</script>
</body>
</html>
